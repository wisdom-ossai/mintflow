name: mintflow_flutter
description: "Mintflow — personal finance that keeps your money in motion."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── State management ──────────────────────────────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  provider: ^6.1.5+1

  # ── Navigation ────────────────────────────────────────────────────────
  go_router: ^17.2.0

  # ── Networking ───────────────────────────────────────────────────────
  dio: ^5.9.2
  # retrofit: ^4.9.2
  pretty_dio_logger: ^1.4.0

  # ── Auth (Mintflow FastAPI + Google + Apple) ───────────────────────────────
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^7.0.1

  # ── Local storage ─────────────────────────────────────────────────────
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5
  # hive_flutter: ^1.1.0

  # ── Plaid ─────────────────────────────────────────────────────────────
  plaid_flutter: ^5.1.1

  # ── Subscriptions ─────────────────────────────────────────────────────
  purchases_flutter: ^9.16.1 # RevenueCat

  # ── Push notifications ────────────────────────────────────────────────
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^21.0.0

  # ── Charts ────────────────────────────────────────────────────────────
  fl_chart: ^1.2.0

  # ── UI components ─────────────────────────────────────────────────────
  flutter_svg: ^2.2.4
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.3
  percent_indicator: ^4.2.5
  flutter_slidable: ^4.0.3
  modal_bottom_sheet: ^3.0.0
  intl: ^0.20.2
  timeago: ^3.7.1
  currency_text_input_formatter: ^2.3.0
  image_picker: ^1.2.1

  # ── Dependency injection ───────────────────────────────────────────────
  get_it: ^9.2.1
  injectable: ^2.7.1+4

  # ── Utilities ───────────────────────────────────────────────────────────
  dartz: ^0.10.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  logger: ^2.7.0
  connectivity_plus: ^7.1.1
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  # ── Code generation ───────────────────────────────────────────────────────
  # These three share the same build ^4.0.0 dependency — fully compatible.
  build_runner: ^2.4.9
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  injectable_generator: ^2.4.2
  # retrofit_generator removed along with retrofit (see above)
  # hive_generator removed — incompatible with build_runner >=2.4 (see above)

  # ── Testing ───────────────────────────────────────────────────────────────
  mockito: ^5.4.4
  bloc_test: ^10.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#05122B"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/branding/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
