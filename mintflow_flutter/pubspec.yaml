name: mintflow_flutter
description: "Mintflow — personal finance that keeps your money in motion."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.2+4

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # ── Navigation ────────────────────────────────────────────────────────
  go_router: ^17.5.0

  # ── Networking ───────────────────────────────────────────────────────
  dio: ^5.11.1

  # ── Auth (Mintflow FastAPI + Google + Apple) ───────────────────────────
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1

  # ── Local storage ─────────────────────────────────────────────────────
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.5

  # ── Plaid ─────────────────────────────────────────────────────────────
  plaid_flutter: ^5.2.1

  # ── Subscriptions ─────────────────────────────────────────────────────
  # ≥10.2.3 ships RevenueCat iOS 5.78+ (Xcode 27 PaywallColor fix).
  purchases_flutter: ^10.2.3

  # ── Push notifications ────────────────────────────────────────────────
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # ── UI / formatting ───────────────────────────────────────────────────
  intl: ^0.20.3
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#05122B"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  # CocoaPods already manages iOS deps; avoid SPM bootstrap until Xcode license is accepted.
  config:
    enable-swift-package-manager: false

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/branding/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
